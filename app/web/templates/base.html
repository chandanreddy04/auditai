<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AuditAI{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5fb3'/%3E%3Cpath d='M9 21.5 15 9h2l6 12.5h-2.6l-1.3-2.9h-6.2l-1.3 2.9H9Zm4.9-5h4.2L16 11.6 13.9 16.5Z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">AuditAI <span class="tagline">Audit Intelligence Platform</span></a>
        {% if current_user %}
        <span class="topbar-user">
            {{ current_user.name }}
            <form method="post" action="/logout" style="display:inline;">
                <button type="submit" class="link-button">Log out</button>
            </form>
        </span>
        {% endif %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">AuditAI &middot; AI-assisted audit workpapers, evidence testing, and exception tracking &mdash; every decision reviewed and approved by a human auditor.</footer>
</body>
</html>
