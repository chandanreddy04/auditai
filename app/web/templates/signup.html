{% extends "base.html" %}
{% block title %}Sign up - AuditAI{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="subtle">Set up access to your firm's audit workspace.</p>
        {% if error %}<p class="subtle" style="color: var(--high);">{{ error }}</p>{% endif %}
        <form method="post" action="/signup">
            <input type="text" name="name" placeholder="Your name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password (8+ characters)" required minlength="8">
            <button type="submit">Create account</button>
        </form>
        <p class="subtle small">Already have an account? <a href="/login">Log in</a></p>
    </div>
</div>
{% endblock %}
