{% extends "base.html" %}
{% block title %}Sign up - AuditAI{% endblock %}
{% block content %}
<h1>Create an account</h1>
{% if error %}<p class="subtle" style="color: var(--high);">{{ error }}</p>{% endif %}
<form method="post" action="/signup">
    <p><input type="text" name="name" placeholder="Your name" required style="width:100%; max-width:320px;"></p>
    <p><input type="email" name="email" placeholder="Email" required style="width:100%; max-width:320px;"></p>
    <p><input type="password" name="password" placeholder="Password (8+ characters)" required minlength="8" style="width:100%; max-width:320px;"></p>
    <button type="submit">Create account</button>
</form>
<p class="subtle small">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
