{% extends "base.html" %}
{% block title %}Log in - AuditAI{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtle">Log in to your audit workspace.</p>
        {% if error %}<p class="subtle" style="color: var(--high);">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="subtle small">No account yet? <a href="/signup">Sign up</a></p>
    </div>
</div>
{% endblock %}
