{% extends "base.html" %}
{% block title %}Log in - AuditAI{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="subtle" style="color: var(--high);">{{ error }}</p>{% endif %}
<form method="post" action="/login">
    <p><input type="email" name="email" placeholder="Email" required style="width:100%; max-width:320px;"></p>
    <p><input type="password" name="password" placeholder="Password" required style="width:100%; max-width:320px;"></p>
    <button type="submit">Log in</button>
</form>
<p class="subtle small">No account yet? <a href="/signup">Sign up</a></p>
{% endblock %}
